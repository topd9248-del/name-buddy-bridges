name: Keep Alive 🟢

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping buddy-bots
        run: curl -s https://buddy-bots.onrender.com
      - name: Ping buddy-invite
        run: curl -s https://buddy-invite.onrender.com
      - name: Ping buddy-delete
        run: curl -s https://buddy-delete.onrender.com
